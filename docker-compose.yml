version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nft-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nft_marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nft_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nft-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    container_name: nft-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/nft_marketplace
      - REDIS_URL=redis://redis:6379
      - SOLANA_RPC_URL=https://devnet.helius-rpc.com/?api-key=2e8c0354-4517-46ad-ab2f-1d8dbe88c89e
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nft-marketplace:
    build: .
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_PROGRAM_ID=7jkmajwshoW56VwjHGwPGbTaSNH25z186VBraqQTEGWN
      - VITE_SOLANA_RPC_URL=https://devnet.helius-rpc.com/?api-key=2e8c0354-4517-46ad-ab2f-1d8dbe88c89e
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  redisdata: